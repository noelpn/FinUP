{% extends "layout.html" %}

{% block title %}Edit Expense{% endblock %}

{% block page_title %}
Edit Expense
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card p-4">

        <h4>📝 Edit Expense</h4>

        <form action="/edit/{{ expense.id }}" method="POST">

            <div class="mb-3">

                <label>Date</label>

                <input
                    type="date"
                    class="form-control"
                    name="date"
                    value="{{ expense.date }}"
                    required>

            </div>

            <div class="mb-3">

                <label>Merchant</label>

                <input
                    type="text"
                    class="form-control"
                    name="merchant"
                    value="{{ expense.merchant }}"
                    placeholder="Merchant Name">

            </div>

            <div class="mb-3">

                <label>Category</label>

                <select
                    class="form-select"
                    name="category">

                    <option {% if expense.category == 'Food' %}selected{% endif %}>Food</option>
                    <option {% if expense.category == 'Shopping' %}selected{% endif %}>Shopping</option>
                    <option {% if expense.category == 'Travel' %}selected{% endif %}>Travel</option>
                    <option {% if expense.category == 'Bills' %}selected{% endif %}>Bills</option>
                    <option {% if expense.category == 'Entertainment' %}selected{% endif %}>Entertainment</option>
                    <option {% if expense.category == 'Healthcare' %}selected{% endif %}>Healthcare</option>
                    <option {% if expense.category == 'Education' %}selected{% endif %}>Education</option>
                    <option {% if expense.category == 'Others' %}selected{% endif %}>Others</option>

                </select>

            </div>

            <div class="mb-3">

                <label>Amount</label>

                <input
                    type="number"
                    step="0.01"
                    class="form-control"
                    name="amount"
                    value="{{ expense.amount }}"
                    placeholder="0.00">

            </div>

            <div class="mb-3">

                <label>Payment Method</label>

                <select
                    class="form-select"
                    name="payment">

                    <option {% if expense.payment_method == 'Cash' %}selected{% endif %}>Cash</option>
                    <option {% if expense.payment_method == 'UPI' %}selected{% endif %}>UPI</option>
                    <option {% if expense.payment_method == 'Credit Card' %}selected{% endif %}>Credit Card</option>
                    <option {% if expense.payment_method == 'Debit Card' %}selected{% endif %}>Debit Card</option>
                    <option {% if expense.payment_method == 'Net Banking' %}selected{% endif %}>Net Banking</option>

                </select>

            </div>

            <div class="mb-3">

                <label>Notes</label>

                <textarea
                    class="form-control"
                    rows="3"
                    name="notes">{{ expense.description }}</textarea>

            </div>

            <button
                class="btn btn-success">

                Update Expense

            </button>

            <a href="{{ url_for('expenses') }}" class="btn btn-secondary ms-2">Cancel</a>

        </form>

    </div>

</div>

{% endblock %}
