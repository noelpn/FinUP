<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker | Sign Up</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4f46e5,#7c3aed,#2563eb);
            position:relative;
            overflow-y:auto;
            overflow-x:hidden;
            padding:40px 20px;
        }

        body::before{
            content:"";
            position:fixed;
            width:420px;
            height:420px;
            border-radius:50%;
            background:rgba(255,255,255,.08);
            top:-150px;
            right:-120px;
            z-index:0;
        }

        body::after{
            content:"";
            position:fixed;
            width:350px;
            height:350px;
            border-radius:50%;
            background:rgba(255,255,255,.08);
            bottom:-120px;
            left:-120px;
            z-index:0;
        }

        .container{
            width:100%;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            position:relative;
            z-index:1;
            padding:30px 15px;
        }

        .signup-box{

            width:470px;
            max-width:100%;

            background:rgba(255,255,255,.95);
            backdrop-filter:blur(15px);

            border-radius:20px;

            padding:40px;

            box-shadow:0 20px 60px rgba(0,0,0,.25);

            animation:fade .7s ease;

        }

        @keyframes fade{

            from{
                opacity:0;
                transform:translateY(25px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .logo{

            display:flex;
            justify-content:center;
            margin-bottom:20px;

        }

        .logo img{

            width:100px;
            height:100px;
            object-fit:contain;

        }

        h2{

            text-align:center;
            color:#222;
            font-size:30px;
            margin-bottom:8px;

        }

        .subtitle{

            text-align:center;
            color:#666;
            font-size:15px;
            margin-bottom:30px;

        }

        .flash{

            background:#fde8e8;
            color:#c53030;
            padding:12px;
            border-radius:8px;
            margin-bottom:20px;
            font-size:14px;

        }

        .form-group{

            margin-bottom:18px;

        }

        label{

            display:block;
            margin-bottom:8px;
            font-size:14px;
            font-weight:500;
            color:#444;

        }

        input[type=text],
        input[type=email],
        input[type=password]{

            width:100%;
            padding:14px 15px;

            border:1px solid #d8d8d8;
            border-radius:10px;

            outline:none;

            font-size:15px;

            transition:.3s;

        }

        input:focus{

            border-color:#4f46e5;
            box-shadow:0 0 8px rgba(79,70,229,.2);

        }

        .password-row{

            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;

        }

        .terms{

            display:flex;
            align-items:flex-start;
            gap:10px;

            margin:20px 0 25px;

            color:#555;
            font-size:14px;

        }

        .terms input{

            width:auto;
            margin-top:4px;

        }

        .terms a{

            color:#4f46e5;
            text-decoration:none;
            font-weight:500;

        }

        .terms a:hover{

            text-decoration:underline;

        }

        button{

            width:100%;

            padding:15px;

            border:none;
            border-radius:10px;

            background:#4f46e5;
            color:white;

            font-size:16px;
            font-weight:600;

            cursor:pointer;

            transition:.3s;

        }

        button:hover{

            background:#4338ca;

        }

        .login-link{

            text-align:center;
            margin-top:25px;

            color:#555;
            font-size:15px;

        }

        .login-link a{

            color:#4f46e5;
            text-decoration:none;
            font-weight:600;

        }

        .login-link a:hover{

            text-decoration:underline;

        }

        @media(max-width:600px){

            body{

                align-items:flex-start;

            }

            .container{

                min-height:auto;
                padding:30px 15px;

            }

            .signup-box{

                width:100%;
                padding:30px 25px;

            }

            .password-row{

                grid-template-columns:1fr;
                gap:0;

            }

            .logo img{

                width:80px;
                height:80px;

            }

            h2{

                font-size:26px;

            }

        }

    </style>

</head>
<body>

<div class="container">

    <div class="signup-box">

        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 alt="Finance Tracker Logo">
        </div>

        <h2>Create Account</h2>

        <p class="subtitle">
            Create your Finance Tracker account and start managing your finances.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required>
            </div>

            <div class="password-row">

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required>
                </div>

            </div>

            <div class="terms">

                <input
                    type="checkbox"
                    id="agree"
                    required>

                <label for="agree" style="margin:0;font-weight:400;">
                    I agree to the
                    <a href="#">Terms &amp; Conditions</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </label>

            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">
                Login
            </a>
        </div>

    </div>

</div>

</body>
</html>
