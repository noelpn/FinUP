<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4f46e5,#7c3aed,#2563eb);
            overflow:hidden;
            position:relative;
        }

        body::before{
            content:"";
            position:absolute;
            width:420px;
            height:420px;
            background:rgba(255,255,255,.08);
            border-radius:50%;
            top:-150px;
            right:-120px;
        }

        body::after{
            content:"";
            position:absolute;
            width:350px;
            height:350px;
            background:rgba(255,255,255,.08);
            border-radius:50%;
            bottom:-120px;
            left:-120px;
        }

        .container{
            width:100%;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
            z-index:2;
        }

        .login-box{
            width:430px;
            max-width:100%;
            background:rgba(255,255,255,.95);
            backdrop-filter:blur(15px);
            border-radius:20px;
            padding:40px;
            box-shadow:0 20px 60px rgba(0,0,0,.25);
            animation:fade .7s ease;
        }

        @keyframes fade{
            from{
                opacity:0;
                transform:translateY(25px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{
            display:flex;
            justify-content:center;
            margin-bottom:20px;
        }

        .logo img{
            width:100px;
            height:100px;
            object-fit:contain;
        }

        h2{
            text-align:center;
            color:#222;
            margin-bottom:8px;
            font-size:30px;
        }

        .subtitle{
            text-align:center;
            color:#666;
            margin-bottom:30px;
            font-size:15px;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            color:#444;
            font-weight:500;
        }

        input[type=email],
        input[type=password]{
            width:100%;
            padding:14px 15px;
            border:1px solid #d6d6d6;
            border-radius:10px;
            outline:none;
            font-size:15px;
            transition:.3s;
        }

        input:focus{
            border-color:#4f46e5;
            box-shadow:0 0 8px rgba(79,70,229,.2);
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
            font-size:14px;
        }

        .remember{
            display:flex;
            align-items:center;
            gap:8px;
        }

        .remember input{
            width:auto;
        }

        .options a{
            text-decoration:none;
            color:#4f46e5;
            font-weight:500;
        }

        .options a:hover{
            text-decoration:underline;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#4f46e5;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#4338ca;
        }

        .signup{
            text-align:center;
            margin-top:25px;
            color:#555;
            font-size:15px;
        }

        .signup a{
            color:#4f46e5;
            text-decoration:none;
            font-weight:600;
        }

        .signup a:hover{
            text-decoration:underline;
        }

        .flash{
            padding:12px;
            border-radius:8px;
            margin-bottom:20px;
            background:#fde8e8;
            color:#c53030;
            font-size:14px;
        }

        @media(max-width:480px){

            .login-box{
                padding:30px 25px;
            }

            .logo img{
                width:80px;
                height:80px;
            }

            h2{
                font-size:26px;
            }

            .options{
                flex-direction:column;
                gap:12px;
                align-items:flex-start;
            }

        }
    </style>

</head>

<body>

<div class="container">

    <div class="login-box">

        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 alt="Finance Tracker Logo">
        </div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to your Finance Tracker account
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category,message in messages %}
                <div class="flash">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="{{ url_for('signup') }}">
                Create Account
            </a>
        </div>

    </div>

</div>

</body>
</html>
